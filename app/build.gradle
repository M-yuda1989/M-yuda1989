plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mojapay.sample'
    compileSdk 35

    defaultConfig {
        applicationId 'com.nexa.socialdemo'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '0.1-demo'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
